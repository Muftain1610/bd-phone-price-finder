<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BD Phone Price Finder</title>
<style>
:root{--glass:rgba(255,255,255,.10);--border:rgba(255,255,255,.22);--text:#f4f7ff;--muted:#aab4d6;--accent:#7cf0ff;--a1:#6366f1;--a2:#22d3ee}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:#0b1020;overflow-x:hidden;padding:env(safe-area-inset-top) 16px 48px}
body::before,body::after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);z-index:-1}
body::before{background:#4f46e5;top:-120px;left:-120px;opacity:.7}
body::after{background:#06b6d4;bottom:-140px;right:-120px;opacity:.6}
.wrap{max-width:760px;margin:0 auto}

/* header */
header{padding:34px 0 20px;text-align:center}
.logo{width:68px;height:68px;margin:0 auto 14px;display:block;border-radius:20px;box-shadow:0 10px 30px rgba(34,211,238,.35),0 0 0 1px rgba(255,255,255,.25) inset}
h1{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;background:linear-gradient(90deg,#fff 0%,#a5b4fc 45%,#67e8f9 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--border);color:var(--muted);font-size:.85rem;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tagline i{width:6px;height:6px;border-radius:50%;background:var(--a2);box-shadow:0 0 10px var(--a2)}

.glass{background:var(--glass);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 8px 32px rgba(0,0,0,.35)}
.search{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;margin-bottom:14px}
.search svg{flex:none;opacity:.7}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:1.05rem;padding:12px 4px}
.search input::placeholder{color:var(--muted)}
.search #clr{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--text);font-size:.8rem;cursor:pointer}
.search #clr:hover{background:rgba(255,255,255,.22)}
.search input::-webkit-search-cancel-button{display:none}
footer{max-width:760px;margin:6px auto 0;text-align:center;color:var(--muted);font-size:.75rem;line-height:1.5;opacity:.8}
.search:focus-within{border-color:var(--a2);box-shadow:0 0 0 3px rgba(34,211,238,.18),0 8px 32px rgba(0,0,0,.35)}

/* status chips */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:.76rem;font-weight:600;border:1px solid var(--border);background:var(--glass);color:var(--text);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill.time{color:var(--muted);font-weight:500}
.pill.spec{background:rgba(99,102,241,.22);border-color:rgba(165,180,252,.4);color:#c7d2fe}
.pill.var{background:rgba(251,146,60,.2);border-color:rgba(251,146,60,.5);color:#fdba74}
.pill.sort{background:rgba(34,211,238,.16);border-color:rgba(34,211,238,.45);color:#67e8f9}

/* results */
.phone{padding:18px 22px;margin-bottom:16px}
.phone h2{font-size:1.2rem;margin-bottom:12px}
/* every row shares the same columns: shop | RAM·storage | variant | price | button */
.row{display:grid;grid-template-columns:minmax(120px,1.4fr) 128px 78px 96px 150px;align-items:center;gap:10px;padding:12px;margin:0 -12px;border-radius:14px;transition:background .15s}
.phone:not(.finder) .row{position:relative}
/* straight divider above every row except the first and the highlighted ones */
.phone:not(.finder) .row::before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:var(--border)}
.phone:not(.finder) .phead + .row::before,.phone:not(.finder) .best::before{display:none}
.phone:not(.finder) .row:hover{background:rgba(255,255,255,.05)}
.shop{font-weight:700;min-width:0;display:flex;align-items:center;gap:10px}
.shop .nm{min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.slogo{flex:none;width:32px;height:32px;border-radius:9px;background:#fff;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.slogo.ph{display:inline-flex;align-items:center;justify-content:center;color:#312e81;font-size:.9rem;font-weight:800}
.mid{display:contents;font-size:.85rem;color:var(--muted)}
.spec{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;justify-self:start;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700}
.tag.china{background:#fb923c;color:#2b1200}
.price{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;font-weight:800;font-size:1.05rem;color:var(--accent);white-space:nowrap}
.diff{font-size:.68rem;font-weight:600;color:var(--muted)}
.diff.low{color:#86efac}
.best{margin-top:6px;margin-bottom:6px;background:rgba(34,211,238,.09);box-shadow:inset 0 0 0 1.5px rgba(124,240,255,.85),0 0 22px rgba(34,211,238,.12)}
.bp{flex:none;padding:2px 7px;border-radius:999px;background:var(--accent);color:#06222a;font-size:.62rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.phead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.phead h2{margin:0}
.sum{font-size:.78rem;color:var(--muted)}
.sum b{color:#86efac;font-weight:700}
a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.visit{display:block;text-align:center;padding:8px 14px;border-radius:999px;background:var(--accent);color:#06222a;font-size:.8rem;font-weight:700;text-decoration:none;white-space:nowrap}
.visit:hover{filter:brightness(1.1)}
.visit.alt{background:transparent;color:var(--accent);border:1px solid rgba(124,240,255,.5)}
.visit.alt:hover{background:rgba(124,240,255,.12)}

/* any-phone search card */
.finder h2{margin-bottom:4px}
.finder p{color:var(--muted);font-size:.85rem;margin-bottom:12px}
.finder .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:12px 0;margin:0;border-top:1px solid var(--border);border-radius:0}
.finder .row .shop{min-width:150px}
.finder .row .mid{display:block;flex:1;font-size:.8rem}
.finder .row .visit{display:inline-block}
.empty{text-align:center;color:var(--muted);padding:6px 0 14px;font-size:.9rem}

/* phone view */
@media (max-width:600px){
 body{padding-left:12px;padding-right:12px;padding-bottom:36px}
 body::before,body::after{width:280px;height:280px;filter:blur(70px)}
 header{padding:22px 0 14px}
 .logo{width:56px;height:56px;border-radius:16px;margin-bottom:10px}
 .tagline{font-size:.78rem;padding:5px 12px;max-width:100%}
 .search{padding:4px 6px 4px 14px;border-radius:16px}
 .search input{font-size:16px;padding:11px 4px}
 .chips{gap:6px;margin-bottom:14px}
 .pill{font-size:.7rem;padding:5px 10px}
 .phone{padding:14px 16px;border-radius:16px;margin-bottom:14px}
 .phone h2{font-size:1.05rem}
 .phead{margin-bottom:6px}
 .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;padding:12px 10px;margin:0 -10px}
 .phone:not(.finder) .row::before{left:10px;right:10px}
 .shop{min-width:0;grid-column:1;grid-row:1;font-size:.95rem}
 .price{grid-column:2;grid-row:1;text-align:right;font-size:1.1rem}
 .mid{display:flex;align-items:center;gap:8px;grid-column:1 / -1;grid-row:2;font-size:.8rem}
 .tag:empty{display:none}
 .visit{grid-column:1 / -1;grid-row:3;text-align:center;padding:11px 14px;font-size:.85rem}
 .finder p{font-size:.8rem}
 .finder .row{display:grid;grid-template-columns:1fr auto;padding:12px 0;margin:0}
 .finder .row .shop{grid-column:1;grid-row:1}
 .finder .row .mid{display:block;grid-column:1;grid-row:2}
 .finder .row .visit{grid-column:2;grid-row:1 / span 2;align-self:center;padding:9px 14px}
}
@media (max-width:360px){
 h1{font-size:1.5rem}
 .pill.time{display:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
 <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lg)"/><rect x="164" y="88" width="184" height="336" rx="40" fill="none" stroke="#fff" stroke-width="24"/><rect x="232" y="118" width="48" height="12" rx="6" fill="#fff"/><rect x="206" y="196" width="100" height="26" rx="13" fill="#fff"/><rect x="206" y="256" width="124" height="26" rx="13" fill="#fff" opacity=".85"/><rect x="206" y="316" width="76" height="26" rx="13" fill="#fff" opacity=".65"/></svg>
 <h1>BD Phone Price Finder</h1>
 <div class="tagline"><i></i>Compare prices from shops across Bangladesh</div>
</header>
<div class="glass search">
 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
 <input id="q" type="search" placeholder="Search any phone…" autocomplete="off" aria-label="Search any phone">
 <button id="clr" type="button" aria-label="Clear search" hidden>✕</button>
</div>
<div class="chips" id="status"></div>
<div id="results"></div>
<footer>Prices are taken from each shop’s website and can change at any time. Always confirm the final price on the shop’s page before you buy.</footer>
</div>
<script>
let DATA={phones:[],updated:null};
const $=s=>document.querySelector(s);
const fmt=n=>'৳'+Number(n).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SHOPS=[
 ['KRY International','kryinternational.com'],
 ['SMS Gadget','smsgadget.com'],
 ['Like Telecom','liketelecom.com.bd'],
 ['Rio International','riointernational.com.bd'],
 ['Apple Gadgets BD','applegadgetsbd.com'],
 ['Sumash Tech','sumashtech.com'],
 ['Dazzle','dazzle.com.bd']
];
const LOGOS={
 'KRY International':'logo-kry.png','SMS Gadget':'logo-sms.png','Like Telecom':'logo-like.png',
 'Rio International':'logo-rio.png','Apple Gadgets BD':'logo-apple.png','Sumash Tech':'logo-sumash.png','Dazzle':'logo-dazzle.png'
};
function shopHtml(name,best){
 const f=LOGOS[name];
 const icon=f?'<img class="slogo" src="'+f+'" alt="" width="32" height="32" loading="lazy">'
  :'<span class="slogo ph" aria-hidden="true">'+esc(name.charAt(0).toUpperCase())+'</span>';
 return icon+'<span class="nm">'+esc(name)+(best?'<span class="bp">Lowest price</span>':'')+'</span>';
}
async function load(){
 try{
  const r=await fetch('prices.json?t='+Date.now());
  DATA=await r.json();
  localStorage.setItem('prices',JSON.stringify(DATA));
 }catch(e){
  try{const c=localStorage.getItem('prices');if(c)DATA=JSON.parse(c);}catch(_){}
 }
 renderStatus();
 render();
}
function renderStatus(){
 let when='unknown';
 if(DATA.updated){
  when=new Date(DATA.updated).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
 }
 $('#status').innerHTML=
  '<span class="pill time">🕒 Checked '+esc(when)+'</span>'+
  '<span class="pill spec">📦 12GB / 256GB</span>'+
  '<span class="pill var">🇨🇳 China variant</span>'+
  '<span class="pill sort">↑ Lowest price first</span>';
}
function finderCard(q){
 const rows=SHOPS.map(([name,dom])=>{
  const url='https://www.google.com/search?q='+encodeURIComponent(q+' site:'+dom);
  return '<div class="row"><div class="shop">'+shopHtml(name)+'</div><div class="mid">Find '+esc(q)+' on this shop</div><a class="visit alt" href="'+url+'" target="_blank" rel="noopener noreferrer">Search shop ↗</a></div>';
 }).join('');
 const all='https://www.google.com/search?q='+encodeURIComponent(q+' price in Bangladesh');
 return '<div class="glass phone finder"><h2>Search “'+esc(q)+'” on the shops</h2><p>Exact prices are tracked for the Vivo X300 so far. For other phones, these links open each shop’s own results.</p>'+rows+
  '<div class="row"><div class="shop"><span class="slogo ph" aria-hidden="true">🌐</span><span class="nm">All of Bangladesh</span></div><div class="mid">Compare across every seller</div><a class="visit" href="'+all+'" target="_blank" rel="noopener noreferrer">Search the web ↗</a></div></div>';
}
function render(){
 const raw=$('#q').value.trim();
 const q=raw.toLowerCase().replace(/\s+/g,' ');
 const terms=q.split(' ').filter(Boolean);
 const out=$('#results');out.innerHTML='';
 let shown=0;
 if(!DATA.phones.length){
  out.innerHTML='<div class="empty">Couldn’t load prices. Check your connection and reload the page.</div>';
  return;
 }
 DATA.phones.forEach(p=>{
  const name=p.name.toLowerCase();
  if(terms.length&&!terms.every(t=>name.includes(t)))return;
  const offers=p.offers.slice().sort((a,b)=>(a.price==null)-(b.price==null)||a.price-b.price||a.shop.localeCompare(b.shop));
  if(!offers.length)return;
  const prices=offers.filter(o=>o.price!=null).map(o=>o.price);
  const min=prices.length?Math.min(...prices):null;
  const card=document.createElement('div');card.className='glass phone';
  const maxP=prices.length?Math.max(...prices):null;
  const sum=prices.length>1?'<div class="sum">'+prices.length+' shops · save up to <b>'+fmt(maxP-min)+'</b></div>':'';
  card.innerHTML='<div class="phead"><h2>'+esc(p.name)+'</h2>'+sum+'</div>'+offers.map(o=>{
   const spec=(o.ram&&o.rom&&o.ram!=='-')?esc(o.ram)+' RAM · '+esc(o.rom):'';
   const tag=o.variant?'<span class="tag '+esc(o.variant)+'">'+esc(o.variant.toUpperCase())+'</span>':'<span class="tag"></span>';
   const diff=(o.price!=null&&min!==null&&prices.length>1)?(o.price===min?'<small class="diff low">lowest</small>':'<small class="diff">+'+fmt(o.price-min)+'</small>'):'';
   const price='<span>'+(o.price!=null?fmt(o.price):'—')+'</span>'+diff;
   const btn=o.url?'<a class="visit" href="'+esc(o.url)+'" target="_blank" rel="noopener noreferrer">Visit the shop ↗</a>':'<span></span>';
   const isBest=min!==null&&o.price===min&&prices.length>1;
   const cls='row'+(isBest?' best':'');
   return '<div class="'+cls+'"><div class="shop">'+shopHtml(o.shop,isBest)+'</div><div class="mid"><span class="spec">'+spec+'</span>'+tag+'</div><div class="price">'+price+'</div>'+btn+'</div>';
  }).join('');
  out.appendChild(card);shown++;
 });
 if(terms.length){
  if(!shown){
   const e=document.createElement('div');e.className='empty';
   e.textContent='No tracked prices for “'+raw+'” yet.';
   out.appendChild(e);
  }
  out.insertAdjacentHTML('beforeend',finderCard(raw));
 }
}
function syncClear(){$('#clr').hidden=!$('#q').value;}
$('#q').addEventListener('input',()=>{syncClear();render();});
$('#clr').addEventListener('click',()=>{$('#q').value='';syncClear();render();$('#q').focus();});
load();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
